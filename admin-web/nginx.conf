server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DNS nội bộ của Docker: nginx tự phân giải lại IP của "api"
    # mỗi khi container api được tạo lại (tránh lỗi 502 sau khi deploy).
    resolver 127.0.0.11 valid=10s;
    set $backend http://api:8000;

    client_max_body_size 2m;   # file TXT tối đa 1 MB

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /audio/ {
        proxy_pass $backend;
    }

    # React Router: mọi đường dẫn còn lại trả về index.html
    location / {
        try_files $uri /index.html;
    }
}
