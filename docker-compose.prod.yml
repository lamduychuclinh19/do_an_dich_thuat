name: museum-guide

services:
  api:
    image: ${API_IMAGE:?API_IMAGE chưa được đặt}
    restart: unless-stopped
    env_file: .env
    volumes:
      - audio_data:/app/uploads/audio

  web:
    image: ${WEB_IMAGE:?WEB_IMAGE chưa được đặt}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"

volumes:
  audio_data:
