name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Giá trị giả cho test: SQLAlchemy chỉ tạo engine, không bao giờ kết nối.
  DB_SERVER: localhost
  DB_NAME: MuseumGuideDB
  DB_DRIVER: ODBC Driver 18 for SQL Server
  JWT_SECRET_KEY: github-actions-test-secret-key-0123456789
  JWT_EXPIRE_MINUTES: "60"

jobs:
  # ---------------------------------------------------------------- CI
  backend:
    name: Backend (unit -> integration)
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v7

      - name: Cài Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cài thư viện
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Kiểm tra cú pháp
        run: python -m compileall -q app database

      - name: Chạy test
        run: python -m pytest tests -v --cov=app --cov-report=term-missing

  frontend:
    name: Frontend (lint -> build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v7

      - name: Cài Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-web/package-lock.json

      - name: Cài thư viện
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: /

  # ---------------------------------------------------------------- CD
  publish-images:
    name: Build và đẩy Docker image lên GHCR
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      - name: Tên image (bắt buộc viết thường)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build và push image backend
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.sha }}
            ${{ steps.name.outputs.image }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build và push image giao diện quản lý
        uses: docker/build-push-action@v7
        with:
          context: admin-web
          push: true
          tags: |
            ${{ steps.name.outputs.image }}-web:${{ github.sha }}
            ${{ steps.name.outputs.image }}-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    name: Deploy lên server
    needs: publish-images
    runs-on: ubuntu-latest
    # Tạo Environment "production" trên GitHub; bật "Required reviewers"
    # nếu muốn có bước bấm duyệt trước khi deploy.
    environment: production
    permissions:
      contents: read
      packages: read   # để server kéo được image riêng tư từ GHCR
    steps:
      - uses: actions/checkout@v7

      - name: Cấu hình SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Gửi docker-compose lên server
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: >
          scp -i ~/.ssh/id_deploy docker-compose.prod.yml
          "$TARGET:$DEPLOY_PATH/docker-compose.yml"

      - name: Kéo image mới và khởi động lại
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          IMAGE: ${{ needs.publish-images.outputs.image }}
          TAG: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh -i ~/.ssh/id_deploy "$TARGET" bash -s <<EOF
          set -euo pipefail
          cd "$DEPLOY_PATH"
          export API_IMAGE="$IMAGE:$TAG" WEB_IMAGE="$IMAGE-web:$TAG"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          docker compose pull
          docker logout ghcr.io
          docker compose up -d --remove-orphans --wait --wait-timeout 120
          docker image prune -f
          EOF

      - name: Smoke test (nginx -> API -> SQL Server)
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/id_deploy "$TARGET" \
            "curl -fsS --retry 10 --retry-delay 3 --retry-connrefused \
             'http://127.0.0.1/api/public/guide/load-all?language_code=vi'"
