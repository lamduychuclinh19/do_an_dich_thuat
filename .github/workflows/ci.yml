name: CI/CD

# Chạy kiểm tra backend, lint/build frontend và lưu artifact cho mỗi nhánh.
on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Kiểm tra cú pháp và bộ kiểm thử Python trên runner Linux.
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    env:
      DB_SERVER: localhost
      DB_NAME: MuseumGuideDB_V2
      DB_DRIVER: ODBC Driver 18 for SQL Server
      JWT_SECRET_KEY: github-actions-test-secret-key
      JWT_EXPIRE_MINUTES: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install ODBC runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes unixodbc-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q app database

      - name: Run backend tests
        run: python -m pytest -v

  # Kiểm tra quy tắc mã nguồn và đóng gói giao diện quản trị.
  frontend:
    name: Frontend checks and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin-web/package-lock.json

      - name: Install frontend dependencies
        working-directory: admin-web
        run: npm ci

      - name: Lint frontend
        working-directory: admin-web
        run: npm run lint

      - name: Build frontend
        working-directory: admin-web
        run: npm run build

      - name: Publish frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-web-dist
          path: admin-web/dist/
          if-no-files-found: error
          retention-days: 7
