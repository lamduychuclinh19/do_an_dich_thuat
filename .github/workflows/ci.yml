name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Giá trị giả cho test: SQLAlchemy chỉ tạo engine, không bao giờ kết nối.
  DB_SERVER: localhost
  DB_NAME: MuseumGuideDB
  DB_DRIVER: ODBC Driver 18 for SQL Server
  JWT_SECRET_KEY: github-actions-test-secret-key-0123456789
  JWT_EXPIRE_MINUTES: "60"

jobs:
  # ---------------------------------------------------------------- CI
  backend:
    name: Backend (unit -> integration)
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v7

      - name: Cài Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cài thư viện
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Kiểm tra cú pháp
        run: python -m compileall -q app database

      - name: Chạy test
        run: python -m pytest tests -v --cov=app --cov-report=term-missing

  frontend:
    name: Frontend (lint -> build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v7

      - name: Cài Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-web/package-lock.json

      - name: Cài thư viện
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: /

  