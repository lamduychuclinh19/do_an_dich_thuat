{% extends "base.html" %}
{% block title %}Audio Guide{% endblock %}
{% block head %}<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">{% endblock %}

{% block content %}
<header class="top">
  <h1 data-i18n="guide_title">Audio guide</h1>
</header>

<div id="lang-picker" class="lang-picker guide-lang-picker" role="radiogroup"
     aria-label="Narration language"></div>

<section id="loc-card" class="panel loc-card" hidden></section>

<!-- Map modal opened by the "Map" button in header -->
<div id="map-modal" class="map-modal" hidden>
  <div class="map-dialog" role="dialog" aria-modal="true" aria-label="Map">
    <button type="button" id="map-close" class="map-close" aria-label="Close map">&times;</button>
    <div id="map" class="map" aria-label="Map"></div>
  </div>
</div>

<section>
  <h2 data-i18n="all_places">Places</h2>
  <p id="fallback-note" class="note" hidden></p>
  
  <ul id="poi-list" class="poi-list grid-8-items"></ul>
</section>
{% endblock %}
{% block scripts %}
<div id="poi-modal" class="poi-modal" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script type="module" src="{{ url_for('static', filename='js/pages/guidePage.js') }}"></script>
{% endblock %}
